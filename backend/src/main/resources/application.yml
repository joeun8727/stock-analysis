spring:
  application:
    name: stock-analysis
  datasource:
    # preserveInstants=false keeps DATETIME columns as wall-clock: Hibernate binds LocalDateTime
    # through java.sql.Timestamp, and without this the driver shifts it by the JVM/server tz offset
    # (KST -> UTC), so JPA columns would disagree with the raw-JDBC ones (price_bar.ts, trade.*_ts).
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stock_analysis}?rewriteBatchedStatements=true&connectionTimeZone=UTC&preserveInstants=false&characterEncoding=UTF-8
    username: ${DB_USER:stock}
    password: ${DB_PASSWORD:stock}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

# Live trading against Korea Investment & Securities. Everything is off by default: with no app key
# the scheduler simply never has a verified, armed strategy to run.
#
# mode is DRY_RUN | PAPER | REAL and comes from the environment on purpose — moving to a real
# account should take a deliberate restart, not an API call. Trading *rules* are not here at all;
# they live in strategy.spec_json so live trades exactly what was backtested.
kis:
  mode: ${KIS_MODE:DRY_RUN}
  app-key: ${KIS_APP_KEY:}
  app-secret: ${KIS_APP_SECRET:}
  account-no: ${KIS_ACCOUNT_NO:}
  account-product-code: ${KIS_ACCOUNT_PRODUCT_CODE:01}
  # Separate credentials for quotes, for when the paper server won't serve domestic futures prices
  # (the pre-market futures move is the entry signal, so it has to come from somewhere real).
  quote-app-key: ${KIS_QUOTE_APP_KEY:}
  quote-app-secret: ${KIS_QUOTE_APP_SECRET:}
  ws-stale-seconds: ${KIS_WS_STALE_SECONDS:30}

app:
  data-dir: ${APP_DATA_DIR:../data}
  # LLM recommendation runs the local Claude Code CLI headlessly (no API key).
  claude-bin: ${CLAUDE_BIN:claude}
  recommend-timeout-seconds: ${RECOMMEND_TIMEOUT:150}

server:
  port: 8080
