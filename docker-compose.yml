# 설정값은 저장소 루트의 .env에서 읽습니다 (compose가 자동으로 읽습니다).
# .env가 없으면 변수가 빈 문자열이 되어 MySQL이 뜨지 않습니다 — cp .env.example .env 로 만드세요.
services:
  mysql:
    image: mysql:8.0
    container_name: stock_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set it in .env}
      MYSQL_USER: ${MYSQL_USER:?set it in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set it in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: stock_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_DATA_DIR: /app/data
      # 실투자 자격증명 — .env에 없으면 빈 값이고, 그러면 실투자 기능은 동작하지 않습니다.
      KIS_MODE: ${KIS_MODE:-DRY_RUN}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO:-}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-01}
      KIS_QUOTE_APP_KEY: ${KIS_QUOTE_APP_KEY:-}
      KIS_QUOTE_APP_SECRET: ${KIS_QUOTE_APP_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      # Must be a build arg, not just a runtime env: Next.js bakes NEXT_PUBLIC_* into the
      # client bundle during `npm run build`. Changing it needs `docker compose up --build`.
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    container_name: stock_frontend
    depends_on:
      - backend
    environment:
      # Kept for server-side rendering; the browser uses the value baked in above.
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    ports:
      - "3000:3000"

volumes:
  mysql_data:
