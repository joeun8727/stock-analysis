# 설정값은 저장소 루트의 .env에서 읽습니다 (compose가 자동으로 읽습니다).
# .env가 없으면 변수가 빈 문자열이 되어 MySQL이 뜨지 않습니다 — cp .env.example .env 로 만드세요.
#
# 포트는 기본적으로 이 PC(127.0.0.1)에만 열립니다. 실투자 API에는 인증이 없어서
# /api/live/arm 하나로 실계좌 주문이 시작될 수 있는데, 0.0.0.0에 열면 같은 네트워크의
# 누구나 그걸 부를 수 있습니다. 다른 기기에서 접속해야 하면 .env의 BIND_ADDR을 바꾸되,
# 그 전에 인증을 먼저 붙이세요.
services:
  mysql:
    image: mysql:8.0
    container_name: stock_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set it in .env}
      MYSQL_USER: ${MYSQL_USER:?set it in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set it in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: stock_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_DATA_DIR: /app/data
      # 실투자 자격증명 — .env에 없으면 빈 값이고, 그러면 실투자 기능은 동작하지 않습니다.
      KIS_MODE: ${KIS_MODE:-DRY_RUN}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO:-}
      KIS_ACCOUNT_PRODUCT_CODE: ${KIS_ACCOUNT_PRODUCT_CODE:-01}
      KIS_QUOTE_APP_KEY: ${KIS_QUOTE_APP_KEY:-}
      KIS_QUOTE_APP_SECRET: ${KIS_QUOTE_APP_SECRET:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      # 런타임 env가 아니라 빌드 인자여야 합니다: Next.js가 `npm run build` 중에
      # NEXT_PUBLIC_* 를 클라이언트 번들에 구워 넣습니다. 값을 바꾸면 `docker compose up --build`가 필요합니다.
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    container_name: stock_frontend
    depends_on:
      - backend
    environment:
      # 서버 사이드 렌더링용으로 남겨둡니다. 브라우저는 위에서 구워 넣은 값을 씁니다.
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"

volumes:
  mysql_data:
